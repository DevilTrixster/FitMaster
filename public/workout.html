<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренировка - FitMaster</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/workout.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <!-- Навигация -->
  <nav class="navbar">
    <div class="nav-brand">Fit<span class="brand-accent">Master</span></div>
    <div class="nav-user">
      <a href="/dashboard" class="nav-link">Личный кабинет</a>
      <a href="/history" class="nav-link">История</a>
      <a href="/progress" class="nav-link">Прогресс</a>
      <a href="/profile" class="nav-link">Профиль</a>
    </div>
  </nav>

  <div class="container">
    <!-- Секция таймера -->
    <div class="timer-section">
      <span class="timer-icon">⏱️</span>
      <span class="timer-display" id="timerDisplay">00:00</span>
      <button id="startTimerBtn" class="btn btn-small">Старт 60 с</button>
      <button id="resetTimerBtn" class="btn btn-small">Сброс</button>
    </div>

    <!-- Блок рекомендаций (заполняется скриптом) -->
    <div id="adaptationHint" class="adaptation-hint hidden"></div>

    <!-- Упражнения -->
    <div id="exercisesList" class="exercises-grid"></div>

    <!-- Кнопка завершения -->
    <div class="finish-section">
      <button id="finishBtn" class="btn btn-primary btn-large" disabled>Завершить тренировку</button>
    </div>

    <!-- Карточка завершения -->
    <div id="completionSection" class="completion-card hidden">
      <h2>Тренировка завершена</h2>
      <p>Оцените самочувствие</p>
      <div class="stars">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>
      <textarea id="commentsInput" placeholder="Заметки (необязательно)"></textarea>
      <button id="submitFinishBtn" class="btn btn-primary btn-large">Сохранить и завершить</button>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/workout.js"></script>
</body>
</html>
