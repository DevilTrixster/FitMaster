<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - FitMaster</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <!-- Навигация -->
  <nav class="navbar">
    <div class="nav-brand">Fit<span class="brand-accent">Master</span></div>
    <div class="nav-user">
      <a href="/auth/login.html" id="logoutBtn" class="nav-link btn-logout">Вход</a>
    </div>
  </nav>

  <!-- Основной контент -->
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Регистрация</h1>
      
      <div id="message" class="message"></div>
      
      <form id="registerForm">
        <!-- Никнейм и Email -->
        <div class="form-row">
          <div class="form-group">
            <label for="nickname">Никнейм *</label>
            <input type="text" id="nickname" name="nickname" placeholder="Ваш никнейм" required>
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
        </div>

        <!-- Имя и Фамилия -->
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Имя *</label>
            <input type="text" id="firstName" name="firstName" placeholder="Имя" required>
          </div>
          <div class="form-group">
            <label for="lastName">Фамилия *</label>
            <input type="text" id="lastName" name="lastName" placeholder="Фамилия" required>
          </div>
        </div>

        <!-- Пароли -->
        <div class="form-group">
          <label for="password">Пароль *</label>
          <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Подтвердите пароль *</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" required>
        </div>

        <!-- Дата рождения и Пол -->
        <div class="form-row">
          <div class="form-group">
            <label for="birthDate">Дата рождения *</label>
            <input type="date" id="birthDate" name="birthDate" required>
          </div>
          <div class="form-group">
            <label for="gender">Пол *</label>
            <div class="select-wrapper">
              <select id="gender" name="gender" required>
                <option value="" disabled selected>Выберите пол</option>
                <option value="male">Мужской</option>
                <option value="female">Женский</option>
              </select>
            </div>
          </div>

    <div class="form-row">
      <div class="form-group">
        <label for="experienceLevel">Ваш уровень опыта</label>
        <div class="select-wrapper">
          <select id="experienceLevel" name="experienceLevel" required>
            <option value="beginner">Новичок (0–3 месяца)</option>
            <option value="novice" selected>Начинающий (3–12 месяцев)</option>
            <option value="intermediate">Опытный (1–3 года)</option>
            <option value="advanced">Продвинутый (3–5 лет)</option>
            <option value="master">Мастер (5–8 лет)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="fitnessGoal">Ваша цель тренировок</label>
        <div class="select-wrapper">
          <select id="fitnessGoal" name="fitnessGoal" required>
            <option value="weight_loss">Похудение</option>
            <option value="muscle_gain">Набор мышечной массы</option>
            <option value="strength">Увеличение силы</option>
            <option value="maintenance" selected>Поддержание формы</option>
            <option value="endurance">Выносливость</option>
            <option value="aesthetics">Улучшение внешнего вида</option>
            <option value="recomposition">Рекомпозиция тела</option>
            <option value="mobility">Мобильность / гибкость</option>
            <option value="rehabilitation">Реабилитация</option>
            <option value="sports">Спортивная подготовка</option>
            <option value="event">Подготовка к событию</option>
            <option value="stress_relief">Антистресс</option>
            <option value="energy">Повышение энергии</option>
            <option value="competition">Соревнования</option>
            <option value="posture">Улучшение осанки</option>
            <option value="healthy_aging">Здоровое старение</option>
          </select>
        </div>
      </div>
    </div>
        </div>

        <!-- Рост и Вес -->
        <div class="form-row">
          <div class="form-group">
            <label for="height">Рост (см) *</label>
            <input type="number" id="height" name="height" placeholder="175" min="100" max="250" required>
          </div>
          <div class="form-group">
            <label for="weight">Вес (кг) *</label>
            <input type="number" id="weight" name="weight" placeholder="75" min="30" max="300" step="0.1" required>
          </div>
        </div>

        <!-- Кнопка регистрации -->
        <button type="submit" class="btn-submit">Создать аккаунт</button>
      </form>

      <!-- Ссылка на вход -->
      <p class="auth-footer">
        Уже есть аккаунт? <a href="/auth/login.html">Войти</a>
      </p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
