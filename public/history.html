<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>История тренировок - FitMaster</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/history.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Fit<span class="brand-accent">Master</span></div>
    <div class="nav-user">
      <a href="/dashboard" class="nav-link">Личный кабинет</a>
      <a href="/history" class="nav-link active">История</a>
      <a href="/progress" class="nav-link">Прогресс</a>
      <a href="/profile" class="nav-link">Профиль</a>
    </div>
  </nav>

  <div class="container">
    <h1>История тренировок</h1>

    <!-- Панель фильтров и сортировки -->
    <div class="filters-panel">
      <div class="filter-group">
        <label>Сортировка:</label>
        <select id="sortBy">
          <option value="scheduled_date">По дате</option>
          <option value="wellness_rating">По самочувствию</option>
          <option value="total_volume">По объёму</option>
        </select>
        <select id="sortOrder">
          <option value="DESC">Сначала новые</option>
          <option value="ASC">Сначала старые</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Период:</label>
        <input type="date" id="dateFrom" placeholder="с">
        <input type="date" id="dateTo" placeholder="по">
      </div>

      <div class="filter-group">
        <label>Упражнение:</label>
        <select id="exerciseFilter">
          <option value="">Все</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Группа мышц:</label>
        <select id="muscleGroupFilter">
          <option value="">Все</option>
          <option value="chest">Грудь</option>
          <option value="back">Спина</option>
          <option value="legs">Ноги</option>
          <option value="shoulders">Плечи</option>
          <option value="arms">Руки</option>
          <option value="core">Пресс</option>
        </select>
      </div>

      <button id="applyFiltersBtn" class="btn btn-primary">Применить</button>
      <button id="resetFiltersBtn" class="btn btn-outline">Сбросить</button>
    </div>

    <!-- Список тренировок -->
    <div id="historyList" class="history-list">
      <div class="loading">Загрузка истории...</div>
    </div>

    <!-- Кнопка "Загрузить ещё" -->
    <div class="load-more-container">
      <button id="loadMoreBtn" class="btn btn-secondary" style="display: none;">Загрузить ещё</button>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
